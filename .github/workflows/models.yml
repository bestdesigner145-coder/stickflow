name: Models

# Spec 18.10 A5: the report that chooses the built-in model, and the video of
# the first launch with the real models (17.5a). Gigabytes of downloads, so
# only for a commit whose message has [llm] or [video], or by hand. A workflow
# of its own: a push to the branch does not cancel a report under way.
on:
  push:
    branches: ["stage-*", main]
  workflow_dispatch:

concurrency:
  group: models-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Spec 18.10 A5: the set through every candidate model, run inside the
  # process by llama.cpp as the app runs it, on an arm64 runner. One runner per
  # model, in parallel. Gigabytes of downloads, so only for a commit whose
  # message has [llm], or by hand.
  llm:
    name: Model report (${{ matrix.candidate.name }})
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[llm]') }}
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - { name: baseline }
          - { name: qwen3-4b, repo: Qwen/Qwen3-4B-GGUF }
          - { name: qwen3-4b-2507, repo: unsloth/Qwen3-4B-Instruct-2507-GGUF }
          - { name: qwen3.5-4b, repo: unsloth/Qwen3.5-4B-GGUF }
          - { name: qvikhr-3-4b, repo: Vikhrmodels/QVikhr-3-4B-Instruction-GGUF }
          - { name: gemma-3-4b, repo: unsloth/gemma-3-4b-it-GGUF }
          - { name: qwen3-1.7b, repo: unsloth/Qwen3-1.7B-GGUF }
    env:
      # The ceiling of spec 18.10 A5, when the repository has the key.
      ANTHROPIC_API_KEY: ${{ matrix.candidate.name == 'baseline' && secrets.ANTHROPIC_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string hw.memsize hw.perflevel0.physicalcpu || true
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal" || true
          df -h "$RUNNER_TEMP" | tail -1

      - name: Build the report
        run: swift build -c release --package-path LocalModel --product stickflow-report

      - name: Download the model
        if: ${{ matrix.candidate.repo }}
        run: |
          mkdir -p report
          python3 scripts/fetch-gguf.py "${{ matrix.candidate.repo }}" Q4_K_M.gguf "$RUNNER_TEMP/model.gguf" report/facts.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Report
        run: |
          mkdir -p report
          BIN="$(swift build -c release --package-path LocalModel --show-bin-path)/stickflow-report"
          args=(--fixtures StickflowCore/Tests/StickflowCoreTests/StructuringFixtures/semantic.json
                --machine "GitHub $(uname -m), $(sysctl -n machdep.cpu.brand_string), $(( $(sysctl -n hw.memsize) / 1073741824 )) ГБ"
                --output report/report.md --json report/summary.json)
          if [ -n "${{ matrix.candidate.repo }}" ]; then args+=(--no-rules --local "${{ matrix.candidate.name }}=$RUNNER_TEMP/model.gguf"); fi
          # Metal first; a runner whose GPU cannot take the model runs it on the CPU.
          "$BIN" "${args[@]}" || STICKFLOW_GPU_LAYERS=0 "$BIN" "${args[@]}"
          sed -n '1,20p' report/report.md

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.candidate.name }}
          path: report
          if-no-files-found: ignore

  llm-summary:
    name: Model report, all candidates
    needs: llm
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[llm]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
      - name: Combine
        run: |
          python3 scripts/combine-reports.py reports summary.md
          cat summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: model-choice
          path: |
            summary.md
            reports

  # Spec 17.5a and 18.10: the video report. The first launch on a clean Mac:
  # the window "Voice → tasks", «Скачать», the real download of both models,
  # the microphone (a sound file of the B3.1 dictation in its place), the sticker.
  video:
    name: Video of the first launch
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[video]') }}
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          which xcodegen || brew install xcodegen
          which ffmpeg || brew install ffmpeg
          xcodegen generate

      - name: Build app (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stickflow.xcodeproj \
            -scheme Stickflow \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            STICKFLOW_COMMIT="${GITHUB_SHA::7}" \
            -quiet 2>&1 | tee build.log

      - name: The dictation of spec 18.9 B3.1
        run: |
          mkdir -p demo
          phrase="$(python3 -c "import re; s=open('StickflowCore/Sources/StickflowCore/Structuring/StructurePrompt.swift').read(); m=re.search(r'uxFeedbackPhrase = (.*?)\n\n', s, re.S); print(''.join(re.findall(r'\"(.*?)\"', m.group(1))))")"
          echo "${phrase}"
          say -v Milena -r 175 -o demo/said.aiff "${phrase}"
          afconvert -f WAVE -d LEI16@16000 -c 1 demo/said.aiff demo/said.wav

      - name: Play the first launch and film it
        run: |
          mkdir -p demo/frames
          APP=build/DerivedData/Build/Products/Debug/Stickflow.app/Contents/MacOS/Stickflow
          "$APP" --demo "$PWD/demo/said.wav" --models-root "$RUNNER_TEMP/models" --cpu-only > demo/app.log 2>&1 &
          app=$!
          index=0
          while kill -0 "${app}" 2>/dev/null && [ "${index}" -lt 4800 ]; do
            screencapture -x -C -t jpg "demo/frames/$(printf '%05d' "${index}").jpg" || true
            echo "${index} $(date +%s)" >> demo/times.txt
            index=$((index + 1))
            sleep 0.4
          done
          kill "${app}" 2>/dev/null || true
          cat demo/app.log | grep -v "^llama\|^load\|^print_info" | tail -60
          cat demo/demo.txt || true
          ls demo/frames | wc -l

      - name: Make the video
        if: always()
        run: |
          # Real time, but the waiting for the download and the models is shown faster.
          python3 scripts/make-demo-video.py demo
          ffmpeg -loglevel error -y -f concat -safe 0 -i demo/frames.txt \
            -vf "scale=1280:-2,fps=10,format=yuv420p" -c:v libx264 -preset veryfast -crf 30 demo/first-launch.mp4
          ls -l demo/first-launch.mp4

      # The video as text in the log, for a reader who cannot open artifacts.
      - name: Print the video
        if: always()
        run: |
          for file in demo/first-launch.mp4 demo/demo.txt; do
            [ -f "${file}" ] || continue
            echo "-----BEGIN $(basename "${file}")-----"
            base64 -b 160 -i "${file}"
            echo "-----END $(basename "${file}")-----"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-first-launch
          path: |
            demo/first-launch.mp4
            demo/demo.txt
            demo/app.log
