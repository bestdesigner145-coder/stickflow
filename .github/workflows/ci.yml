name: CI

on:
  push:
    branches: [main, "stage-*"]
  pull_request:
  # Spec 17.3: the heavy checks run at night on main.
  schedule:
    - cron: "23 1 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  # Spec 17.3, stage 1: lint. Nothing else runs until it passes.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SWIFTFORMAT_VERSION: "0.64.7"
      SWIFTLINT_VERSION: "0.65.1"
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads the whole history

      - name: Install linters
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -sSfL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat_linux.zip"
          curl -sSfL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_amd64.zip"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          unzip -oq swiftformat.zip && mv swiftformat_linux bin/swiftformat
          unzip -oq swiftlint.zip swiftlint-static && mv swiftlint-static bin/swiftlint
          tar xzf gitleaks.tgz gitleaks && mv gitleaks bin/gitleaks
          chmod +x bin/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: SwiftFormat
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Secrets
        run: gitleaks detect --redact --no-banner

      - name: Localization
        run: python3 scripts/check-localization.py

  build:
    name: Build and test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-26 ships Xcode 26, macos-15 ships Xcode 16: the oldest toolchain the README promises.
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # The stages follow spec 17.3; the first failure stops the rest.
      - name: StickflowCore tests
        run: swift test --package-path StickflowCore --enable-code-coverage -Xswiftc -warnings-as-errors

      - name: StickflowCore coverage
        run: python3 scripts/check-coverage.py "$(swift test --package-path StickflowCore --show-codecov-path)" 90

      - name: Generate Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      # Warnings are errors in both configurations (project.yml).
      - name: Build app (Debug)
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stickflow.xcodeproj \
            -scheme Stickflow \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet 2>&1 | tee build.log

      - name: Build app (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stickflow.xcodeproj \
            -scheme Stickflow \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=YES \
            -quiet 2>&1 | tee build-release.log

      - name: Store tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Stickflow.xcodeproj \
            -scheme StickflowStoreTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet 2>&1 | tee test.log

      # Spec 17.3, snapshot stage. The references were recorded on this runner image;
      # other macOS versions draw text a little differently.
      - name: Snapshot tests
        id: snapshots
        if: ${{ matrix.os == 'macos-26' }}
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshot-failures
        run: |
          set -o pipefail
          xcodebuild test \
            -project Stickflow.xcodeproj \
            -scheme Stickflow \
            -only-testing:StickflowSnapshotTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet 2>&1 | tee snapshot-test.log

      - name: Upload snapshot differences
        if: ${{ failure() && steps.snapshots.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: |
            snapshot-failures
            Tests/SnapshotTests/__Snapshots__
          retention-days: 14

      # Only for commits tagged [snapshots]: prints references recorded by this run,
      # and pictures that did not match, so they can be read from the log.
      - name: Print recorded snapshots
        if: ${{ !cancelled() && matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[snapshots]') }}
        run: |
          {
            git ls-files --others --exclude-standard Tests/SnapshotTests/__Snapshots__
            find snapshot-failures -name '*.png' 2>/dev/null || true
          } | while read -r file; do
            echo "-----BEGIN $file-----"
            base64 -b 160 -i "$file"
            echo "-----END $file-----"
          done

      # Launches the app, types a sticker through the real editor and checks what was saved.
      - name: Self-check
        run: |
          mkdir -p self-check
          # Another app in the foreground, to check that stickers do not steal focus from it.
          open -a TextEdit && sleep 4
          APP=build/DerivedData/Build/Products/Debug/Stickflow.app/Contents/MacOS/Stickflow
          "$APP" --self-check "$PWD/self-check" &
          APP_PID=$!
          ( sleep 90; kill -9 "$APP_PID" 2>/dev/null ) &
          wait "$APP_PID"

      - name: Upload self-check snapshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: self-check-${{ matrix.os }}
          path: |
            self-check/*.png
            self-check/report.txt
          retention-days: 14

      # Only for commits tagged [snapshots]: prints the PNGs as text so they can be read from the log.
      - name: Print snapshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(github.event.head_commit.message, '[snapshots]') }}
        run: |
          for file in self-check/*.png; do
            [ -f "$file" ] || continue
            echo "-----BEGIN $(basename "$file")-----"
            base64 -b 160 -i "$file"
            echo "-----END $(basename "$file")-----"
          done

      # The PR build of spec 17.1: download, unzip, run.
      - name: Package debug build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Debug/Stickflow.app \
            Stickflow-debug.zip

      - name: Upload debug build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Stickflow-debug-${{ matrix.os }}
          path: Stickflow-debug.zip
          retention-days: 14

  # The only check of the real speech model (spec 7, 17.3): download it the way
  # the app does and recognise speech with it. 445 MB per run, so it runs at
  # night on main, and at once for a commit whose message has [asr].
  asr:
    name: Speech recognition with the real model
    needs: lint
    if: ${{ github.event_name == 'schedule' || contains(github.event.head_commit.message, '[asr]') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build app (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stickflow.xcodeproj \
            -scheme Stickflow \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet 2>&1 | tee build.log

      - name: Make speech to recognise
        run: |
          mkdir -p asr
          say -v '?' | grep -i "ru_RU" || echo "no Russian voice on this runner"
          # The sample from GigaAM's own repository.
          curl -fsSL --max-time 120 -o asr/example.wav https://cdn.chatwm.opensmodel.sberdevices.ru/GigaAM/example.wav \
            || { rm -f asr/example.wav; echo "the GigaAM sample is not reachable"; }
          if say -v Milena -o asr/said.aiff "Купить молоко, потом позвонить маме, и в пятнадцать тридцать созвон с разработкой."; then
            afconvert -f WAVE -d LEI16@16000 -c 1 asr/said.aiff asr/said.wav
          fi
          rm -f asr/said.aiff
          ls -l asr

      - name: Recognise
        run: |
          set -o pipefail
          APP=build/DerivedData/Build/Products/Debug/Stickflow.app/Contents/MacOS/Stickflow
          "$APP" --transcribe asr/*.wav --model-dir "$RUNNER_TEMP/models" --cpu-only 2>&1 | tee asr/log.txt
          python3 scripts/check-transcripts.py asr/log.txt

  # Spec 8.6: the golden set through candidate models, to choose the light one
  # for the app. Gigabytes of downloads and a slow CPU, so only for a commit
  # whose message has [llm]. The times are a runner's, not an M1's.
  llm:
    name: Structuring report on local models
    needs: lint
    if: ${{ contains(github.event.head_commit.message, '[llm]') }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      MODELS: "qwen3:1.7b,qwen3:4b,gemma3:4b"
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build app (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stickflow.xcodeproj \
            -scheme Stickflow \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet 2>&1 | tee build.log

      - name: Start Ollama and pull the models
        run: |
          brew install ollama
          (ollama serve > ollama.log 2>&1 &)
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo
          pulled=""
          for model in ${MODELS//,/ }; do
            if ollama pull "$model"; then pulled="${pulled:+$pulled,}$model"; else echo "could not pull $model"; fi
          done
          ollama list
          echo "PULLED=$pulled" >> "$GITHUB_ENV"

      - name: Report
        run: |
          set -o pipefail
          APP=build/DerivedData/Build/Products/Debug/Stickflow.app/Contents/MacOS/Stickflow
          "$APP" --structure-report StickflowCore/Tests/StickflowCoreTests/StructuringFixtures/rules.json \
            --models "$PULLED" 2>&1 | tee report.txt
          grep -q "^REPORT Rules" report.txt

