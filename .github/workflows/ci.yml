name: CI

on:
  push:
    branches: [main, "stage-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Later steps run even if an earlier one failed, so one run reports every problem.
      - name: StickflowCore tests
        run: swift test --package-path StickflowCore

      - name: Generate Xcode project
        if: ${{ !cancelled() }}
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build app
        id: build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stickflow.xcodeproj \
            -scheme Stickflow \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet 2>&1 | tee build.log

      - name: Store tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Stickflow.xcodeproj \
            -scheme StickflowStoreTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet 2>&1 | tee test.log

      - name: Package debug build
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Debug/Stickflow.app \
            Stickflow-debug.zip

      - name: Upload debug build
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Stickflow-debug
          path: Stickflow-debug.zip
          retention-days: 14
